name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Syntax & Import Check
      run: |
        python -m py_compile backend/config.py
        python -m py_compile backend/network_guard.py
        python -m py_compile backend/controller.py
        bash -n bin/adguard-dns
        bash -n install.sh
        bash -n uninstall.sh
